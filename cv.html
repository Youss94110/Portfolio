<main>
  <section id="cv">
    <div class="section-tag">07 — Curriculum Vitae</div>
    <h2 style="font-size:clamp(1.8rem,3vw,2.6rem)">Mon CV</h2>
    <p style="color:var(--paper-dim); max-width:560px; margin-top:14px;">Le CV est protégé par un code d'accès. Entrez le code pour le consulter et le télécharger.</p>

    <div class="cv-gate" id="cvGate">
      <div class="cv-gate-icon">&#128274;</div>
      <div class="cv-gate-body">
        <label for="cvCode" class="status-label mono">CODE D'ACCÈS</label>
        <div class="cv-gate-row">
          <input id="cvCode" class="cv-input" type="password" inputmode="numeric" placeholder="••••••" autocomplete="off">
          <button id="cvUnlock" class="cv-btn">Déverrouiller</button>
        </div>
        <div id="cvError" class="cv-error"></div>
      </div>
    </div>

    <div class="cv-unlocked" id="cvUnlocked" hidden>
      <div class="cv-toolbar">
        <span class="status-label mono">CV_YOUSSEF_MEFTAH.PDF</span>
        <a id="cvDownload" class="cv-btn cv-btn-ghost" href="cv-youssef-meftah.pdf" download>Télécharger</a>
      </div>
      <div class="cv-frame-wrap">
        <iframe id="cvFrame" class="cv-frame" title="CV Youssef Meftah" src=""></iframe>
      </div>
    </div>
  </section>

  <footer>
    <span>YOUSSEF MEFTAH · BTS SIO SISR · LYCÉE DE CACHAN</span>
  </footer>
</main>

<script src="script.js"></script>
